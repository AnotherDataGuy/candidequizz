<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Comment sont écrites les questions</title>
  <desc id="d">Chaîne d'agents : planificateur, sélecteur de graines, cache de questions vérifiées, puis, avec une clé OpenAI, rédacteur, contrôle de conformité, vérificateur factuel et réparateur, jusqu'à la question servie. Sans clé, la question vient directement de la banque. Le régleur adaptatif ajuste ensuite la difficulté et relance le sélecteur.</desc>
