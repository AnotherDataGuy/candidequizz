<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Candide au guichet</title>
  <desc id="d">S'entraîner à l'examen civique, à son rythme. Version d'essai, en cours de développement.</desc>
  <defs>
    <clipPath id="arche"><path d="M820 340 V170 a120 120 0 0 1 240 0 V340 Z"/></clipPath>
    <path id="cercle" d="M 0,-55 a 55,55 0 1,1 -0.1,0"/>
  </defs>

  <!-- Papier -->
  <rect x="1" y="1" width="1198" height="378" rx="18" fill="#f3f1e5" stroke="#29352a" stroke-opacity=".18"/>

  <!-- Chemin pointillé et repères -->
  <path d="M40 300 C 180 360, 380 250, 560 320 S 760 360, 1170 250" fill="none" stroke="#68705e" stroke-width="1.5" stroke-dasharray="5 7" opacity=".55"/>
  <g stroke="#c9775b" stroke-width="2"><path d="M700 62 h22 M711 51 v22"/></g>
  <g stroke="#b9d58f" stroke-width="2"><path d="M1130 120 h18 M1139 111 v18"/></g>
  <circle cx="770" cy="300" r="6" fill="#b9d58f"/>

  <!-- Texte -->
  <text x="64" y="92" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="15" letter-spacing="2.5" fill="#68705e">01 /  PRÉPARATION À L'EXAMEN CIVIQUE</text>
  <text x="62" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="74" fill="#29352a">Candide au guichet</text>
  <text x="64" y="226" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="27" fill="#29352a" fill-opacity=".85">S'entraîner à l'examen civique, à son rythme.</text>
  <text x="64" y="290" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.5" fill="#68705e">QCM · VRAI OU FAUX · TEXTE À TROUS · EXAMEN BLANC</text>

  <!-- Le guichet -->
  <path d="M808 352 V170 a132 132 0 0 1 264 0 V352" fill="none" stroke="#29352a" stroke-opacity=".45" stroke-width="1.5"/>
  <g clip-path="url(#arche)">
    <rect x="820" y="40" width="240" height="300" fill="#29352a"/>
    <rect x="820" y="40" width="240" height="44" fill="#d6e6b5"/>
    <g stroke="#f3f1e5" stroke-opacity=".12" stroke-width="1.5">
      <path d="M820 104 H1060 M820 124 H1060 M820 144 H1060 M820 164 H1060 M820 184 H1060 M820 204 H1060 M820 224 H1060 M820 244 H1060 M820 264 H1060 M820 284 H1060 M820 304 H1060"/>
    </g>
    <rect x="862" y="168" width="156" height="58" fill="#f3f1e5" fill-opacity=".92"/>
    <text x="940" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="10" letter-spacing="2" fill="#29352a">LIBERTÉ · ÉGALITÉ</text>
    <text x="940" y="213" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#29352a">Guichet ouvert</text>
  </g>
  <rect x="800" y="328" width="280" height="16" fill="#29352a"/>
  <rect x="820" y="318" width="240" height="10" fill="#f9f7ef"/>

  <!-- Tampon -->
  <g transform="translate(1092 262) rotate(-14)">
    <circle r="70" fill="#f3f1e5" stroke="#a34e38" stroke-width="2.5"/>
    <circle r="40" fill="none" stroke="#a34e38" stroke-width="1" stroke-dasharray="3 4"/>
    <text font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#a34e38">
      <textPath href="#cercle" xlink:href="#cercle" textLength="330" lengthAdjust="spacing">VERSION D'ESSAI · QUESTIONS EN TEST ·</textPath>
    </text>
    <text y="7" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#a34e38">bêta</text>
  </g>
