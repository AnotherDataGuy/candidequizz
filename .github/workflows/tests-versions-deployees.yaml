# Tests avec les versions EXACTES de la version en ligne.
#
# Le workflow test-coverage.yaml installe les dernières versions des paquets.
# Celui-ci installe celles de manifest.json (R et paquets), c'est-à-dire ce
# que Connect Cloud fait tourner : une mise à jour d'un paquet qui casserait
# l'application (comme le bug B1 avec {shiny}) apparaît ici avant d'arriver
# chez les amis, et inversement un manifeste trop ancien aussi.
on:
  push:
    branches: [main, master]
    paths: ["R/**", "inst/**", "tests/**", "DESCRIPTION", "NAMESPACE", "manifest.json", ".github/workflows/tests-versions-deployees.yaml"]
  pull_request:
  workflow_dispatch:

name: tests-versions-deployees.yaml

permissions: read-all

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: "true"

    steps:
      - uses: actions/checkout@v6

      - name: Version de R du manifeste
        id: r
        run: echo "version=$(jq -r .platform manifest.json)" >> "$GITHUB_OUTPUT"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ steps.r.outputs.version }}
          use-public-rspm: true

      - name: Paquets aux versions du manifeste
        shell: Rscript {0}
        run: |
          install.packages(c("pak", "jsonlite"))
          m <- jsonlite::read_json("manifest.json")
          refs <- vapply(names(m$packages), function(p) {
            paste0(p, "@", m$packages[[p]]$description$Version)
          }, character(1))
          # Outils de test (absents du manifeste : ils ne tournent pas en ligne).
          pak::pkg_install(c(unname(refs), "testthat", "pkgload"), upgrade = FALSE)
          print(sessionInfo())

      - name: Vérifier que les versions installées sont celles du manifeste
        shell: Rscript {0}
        run: |
          m <- jsonlite::read_json("manifest.json")
          attendu <- vapply(m$packages, function(p) p$description$Version, character(1))
          installe <- vapply(names(attendu), function(p) as.character(utils::packageVersion(p)), character(1))
          ecart <- attendu[attendu != installe]
          if (length(ecart)) stop("Versions différentes : ", paste(names(ecart), collapse = ", "))
          cat("Versions conformes au manifeste :", length(attendu), "paquets\n")

      - name: Tests
        shell: Rscript {0}
        run: |
          options(testthat.progress.max_fails = 1000)
          testthat::test_local(".", stop_on_failure = TRUE, reporter = "summary")
